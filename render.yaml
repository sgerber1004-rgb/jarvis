services:
  - type: worker
    name: jarvis-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CANVAS_TOKEN
        sync: false
      - key: CANVAS_URL
        value: katyisd.instructure.com
      - key: NOTION_TOKEN
        sync: false
      - key: NOTION_DB_ID
        sync: false
